name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PYTHONUNBUFFERED: "1"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  web:
    name: Web checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - name: Production build
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      - name: Performance budgets
        run: npm run perf:ci
      - name: Production dependency audit
        run: npm run audit:prod

  api:
    name: API checks and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auvyren_ci
          POSTGRES_USER: auvyren
          POSTGRES_PASSWORD: auvyren-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auvyren -d auvyren_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://auvyren:auvyren-ci-password@127.0.0.1:5432/auvyren_ci
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      WEB_APP_URL: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      EMAIL_PROVIDER: console
      RATE_LIMIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: apps/api
        run: ruff check app tests
      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Verify migrations match models
        working-directory: apps/api
        run: alembic check
      - name: Tests
        working-directory: apps/api
        run: pytest
      - name: Dependency audit
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip-audit

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auvyren_e2e
          POSTGRES_USER: auvyren
          POSTGRES_PASSWORD: auvyren-e2e-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auvyren -d auvyren_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://auvyren:auvyren-e2e-password@127.0.0.1:5432/auvyren_e2e
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      WEB_APP_URL: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      EMAIL_PROVIDER: console
      RATE_LIMIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: npm ci
      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Apply migrations
        run: npm run migrate
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build production web
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      - name: Desktop journeys
        working-directory: apps/web
        env:
          CI: "true"
        run: npx playwright test --project=chromium
      - name: Mobile journeys
        working-directory: apps/web
        env:
          CI: "true"
        run: npx playwright test --project=mobile
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
